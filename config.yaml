llm:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-reasoner
  temperature: 0.2

fallback:
  enabled: true
  provider: claude
  base_url: https://api.anthropic.com/v1
  api_key: ${CLAUDE_API_KEY}
  model: claude-sonnet-4-20260514

embedding:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-embedding

taiji:
  phi_threshold: 0.65
  max_retry: 3
  snapshot_dir: snapshots

# 浏览器云脑配置（web 模式）
browser:
  mode: text          # "text" | "web"
  headless: true      # web 模式下浏览器是否无头启动
  default_engine: baidu   # 默认搜索引擎: baidu | google | bing
  timeout_ms: 30000   # 页面加载超时（毫秒）

# Walrus Memory — 共享记忆空间
memory:
  enabled: true
  store_dir: memory_store    # 记忆文件存储目录
  auto_register: true        # 自动注册 session 到 MemoryHub

# MCP Bridge — AI 生态桥接
mcp:
  enabled: true
  transport: stdio           # MCP 传输协议: stdio | sse
  tools:
    - taiji.run
    - taiji.status
    - taiji.resume
    - taiji.memory_search
    - taiji.verify
    - taiji.list_sessions
